version: 2
project_name: webprofile-pp-cli
changelog:
  disable: true
builds:
  - id: webprofile-pp-cli
    main: ./cmd/webprofile-pp-cli
    binary: webprofile-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X webprofile-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: webprofile-pp-mcp
    main: ./cmd/webprofile-pp-mcp
    binary: webprofile-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: webprofile-pp-cli
    repository:
      owner: boshenzh
      name: homebrew-tap
    homepage: "https://github.com/boshenzh/webprofile-pp-cli"
    description: "A single-binary CLI for UN Comtrade trade-flow data — converts country names and HS descriptions into numeric..."
    install: |
      bin.install "webprofile-pp-cli"
      bin.install "webprofile-pp-mcp"
